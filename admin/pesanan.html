<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan - Admin CHAOS STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="/assets/image/logo.jpg">
</head>
<body>

<aside class="admin-sidebar" id="sidebar">
  <div class="p-6 border-b border-white/5 flex items-center gap-2">
    <img src="/assets/image/logo.jpg" class="w-9 h-9 rounded-lg" onerror="this.style.display='none'">
    <span class="text-lg font-black neon-text">ADMIN</span>
  </div>
  <nav class="py-4">
    <a href="/admin/dashboard.html" class="admin-nav-item">📊 Dashboard</a>
    <a href="/admin/produk.html" class="admin-nav-item">🎮 Produk</a>
    <a href="/admin/pesanan.html" class="admin-nav-item active">📦 Pesanan</a>
    <a href="/admin/user.html" class="admin-nav-item">👥 Users</a>
    <a href="/admin/chat.html" class="admin-nav-item">💬 Chat</a>
    <a href="/admin/payment.html" class="admin-nav-item">💳 Payment</a>
    <a href="/admin/banner.html" class="admin-nav-item">🖼️ Banner</a>
    <a href="/admin/broadcast.html" class="admin-nav-item">📢 Broadcast</a>
    <a href="/admin/setting.html" class="admin-nav-item">⚙️ Setting</a>
    <a href="/index.html" class="admin-nav-item">🏠 Lihat Toko</a>
    <a href="#" id="btnLogout" class="admin-nav-item" style="color:#ef4444;">🚪 Logout</a>
  </nav>
</aside>

<main class="admin-main">
  <header class="glass-strong px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button id="btnToggle" class="md:hidden text-2xl">☰</button>
      <h1 class="text-xl font-bold">📦 Manajemen Pesanan</h1>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30">🟢 REALTIME</span>
  </header>

  <div class="p-4 md:p-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="stat-card"><div class="text-xs text-gray-400 mb-1">Total</div><div id="cTotal" class="text-2xl font-bold">0</div></div>
      <div class="stat-card"><div class="text-xs text-gray-400 mb-1">Pending</div><div id="cPending" class="text-2xl font-bold text-yellow-400">0</div></div>
      <div class="stat-card"><div class="text-xs text-gray-400 mb-1">Sukses</div><div id="cSukses" class="text-2xl font-bold text-green-400">0</div></div>
      <div class="stat-card"><div class="text-xs text-gray-400 mb-1">Gagal</div><div id="cGagal" class="text-2xl font-bold text-red-400">0</div></div>
    </div>

    <div class="glass-3d p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
        <h2 class="font-bold text-lg">📋 Daftar Pesanan</h2>
        <div class="flex gap-2 flex-wrap">
          <input id="searchOrder" type="text" class="input-field md:max-w-xs" placeholder="🔍 Cari Order ID / No WA">
          <select id="filterStatus" class="input-field md:max-w-[150px]">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="diproses">Diproses</option>
            <option value="sukses">Sukses</option>
            <option value="gagal">Gagal</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Game / Produk</th>
              <th>User</th>
              <th>Total</th>
              <th>Metode</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
      <div id="emptyOrders" class="hidden text-center py-12 text-gray-400">
        <div class="text-4xl mb-2">📦</div>
        <p>Belum ada pesanan</p>
      </div>
    </div>
  </div>
</main>

<div id="modalDetail" class="modal">
  <div class="modal-content glass-3d p-6">
    <h3 class="text-xl font-bold mb-4">📄 Detail Pesanan</h3>
    <div id="detailContent"></div>
    <button onclick="document.getElementById('modalDetail').classList.remove('show')" class="glow-btn-outline w-full mt-4">Tutup</button>
  </div>
</div>

<script type="module">
import { requireAdminSession, adminLogout } from "/assets/js/admin-guard.js";
import {
  db, collection, doc, updateDoc, deleteDoc, onSnapshot, serverTimestamp,
  toast, formatRupiah, formatDate, sendOrderNotif, playSound
} from "/assets/js/main.js";

requireAdminSession();
document.getElementById("btnLogout").onclick = (e) => { e.preventDefault(); adminLogout(); };
document.getElementById("btnToggle").onclick = () => document.getElementById("sidebar").classList.toggle("open");

let orders = [];
let filterQuery = "";
let filterStatus = "";

onSnapshot(collection(db, "orders"), (snap) => {
  orders = [];
  snap.forEach((d) => orders.push({ id: d.id, ...d.data() }));
  orders.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  updateCounters();
  renderOrders();
});

function updateCounters() {
  document.getElementById("cTotal").textContent = orders.length;
  document.getElementById("cPending").textContent = orders.filter((o) => o.status === "pending").length;
  document.getElementById("cSukses").textContent = orders.filter((o) => o.status === "sukses").length;
  document.getElementById("cGagal").textContent = orders.filter((o) => o.status === "gagal").length;
}

function renderOrders() {
  let list = orders;
  if (filterQuery) {
    list = list.filter((o) =>
      (o.orderId || "").toLowerCase().includes(filterQuery) ||
      (o.userId || "").toLowerCase().includes(filterQuery) ||
      (o.gameUserId || "").toLowerCase().includes(filterQuery)
    );
  }
  if (filterStatus) list = list.filter((o) => o.status === filterStatus);

  const tbody = document.getElementById("ordersTable");
  if (list.length === 0) {
    tbody.innerHTML = "";
    document.getElementById("emptyOrders").classList.remove("hidden");
    return;
  }
  document.getElementById("emptyOrders").classList.add("hidden");

  tbody.innerHTML = list.map((o) => `
    <tr>
      <td>
        <div class="font-mono text-xs text-cyan-400">${o.orderId}</div>
        <div class="text-xs text-gray-500">${formatDate(o.createdAt)}</div>
      </td>
      <td>
        <div class="font-semibold">${o.gameName}</div>
        <div class="text-xs text-gray-400">${o.productName}</div>
      </td>
      <td>
        <div class="font-mono text-xs">${(o.userId || '-').substring(0, 15)}</div>
        <div class="text-xs text-gray-500">ID: ${o.gameUserId}</div>
      </td>
      <td class="font-semibold text-cyan-400">${formatRupiah(o.price)}</td>
      <td class="text-xs">${o.paymentName || '-'}</td>
      <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      <td>
        <div class="flex flex-wrap gap-1">
          <button class="btn-sm btn-info" onclick="showDetail('${o.id}')">👁️</button>
          ${o.status === 'pending' ? `<button class="btn-sm btn-warning" onclick="setStatus('${o.id}', 'diproses')">🔄</button>` : ''}
          ${o.status !== 'sukses' ? `<button class="btn-sm btn-success" onclick="setStatus('${o.id}', 'sukses')">✅</button>` : ''}
          ${o.status !== 'gagal' ? `<button class="btn-sm btn-danger" onclick="setStatus('${o.id}', 'gagal')">❌</button>` : ''}
          <button class="btn-sm btn-danger" onclick="delOrder('${o.id}')">🗑️</button>
        </div>
      </td>
    </tr>
  `).join("");
}

document.getElementById("searchOrder").addEventListener("input", (e) => {
  filterQuery = e.target.value.toLowerCase();
  renderOrders();
});

document.getElementById("filterStatus").addEventListener("change", (e) => {
  filterStatus = e.target.value;
  renderOrders();
});

window.showDetail = (id) => {
  const o = orders.find((x) => x.id === id);
  if (!o) return;
  document.getElementById("detailContent").innerHTML = `
    <div class="space-y-3 text-sm">
      <div class="flex justify-between"><span class="text-gray-400">Order ID</span><span class="font-mono text-cyan-400">${o.orderId}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Tanggal</span><span>${formatDate(o.createdAt)}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">User</span><span class="font-mono">${o.userId || '-'}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Game</span><span>${o.gameName}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Produk</span><span>${o.productName}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">User ID Game</span><span class="font-mono">${o.gameUserId}</span></div>
      ${o.serverId ? `<div class="flex justify-between"><span class="text-gray-400">Server</span><span class="font-mono">${o.serverId}</span></div>` : ''}
      ${o.contact ? `<div class="flex justify-between"><span class="text-gray-400">Kontak</span><span>${o.contact}</span></div>` : ''}
      <div class="flex justify-between"><span class="text-gray-400">Metode</span><span>${o.paymentName || '-'}</span></div>
      ${o.paymentData ? `<div class="border-t border-white/10 pt-2 mt-2"><div class="text-gray-400 mb-1">Detail Pembayaran:</div><pre class="text-xs bg-black/40 p-2 rounded overflow-x-auto">${JSON.stringify(o.paymentData, null, 2)}</pre></div>` : ''}
      <div class="flex justify-between border-t border-white/10 pt-2 mt-2"><span class="text-gray-400">Total</span><span class="font-bold neon-text text-lg">${formatRupiah(o.price)}</span></div>
      <div class="flex justify-between"><span class="text-gray-400">Status</span><span class="status-badge status-${o.status}">${o.status}</span></div>
    </div>
  `;
  document.getElementById("modalDetail").classList.add("show");
};

window.setStatus = async (id, status) => {
  try {
    await updateDoc(doc(db, "orders", id), { status, updatedAt: serverTimestamp() });
    toast(`Status → ${status}`, "success");
    playSound("notif");

    const order = orders.find((o) => o.id === id);
    if (order && order.userId && order.userId.startsWith("62")) {
      try {
        await sendOrderNotif(order.userId, { ...order, status });
        toast("WA notif terkirim ke user", "info");
      } catch (e) {
        console.warn("WA notif gagal:", e);
      }
    }
  } catch (err) {
    toast("Gagal: " + err.message, "error");
  }
};

window.delOrder = async (id) => {
  if (!confirm("Hapus pesanan ini permanen?")) return;
  try {
    await deleteDoc(doc(db, "orders", id));
    toast("Pesanan dihapus", "success");
  } catch (err) {
    toast("Gagal: " + err.message, "error");
  }
};
</script>

</body>
</html>
