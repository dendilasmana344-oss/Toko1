<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

<aside class="admin-sidebar" id="sidebar">
  <div class="p-6 border-b border-white/5">
    <a href="/admin/admin-dashboard.html" class="text-xl font-extrabold neon-text">🛡️ ADMIN PANEL</a>
  </div>
  <nav class="py-4">
    <a href="/admin/admin-dashboard.html" class="admin-nav-item">📊 Dashboard</a>
    <a href="/admin/admin-produk.html" class="admin-nav-item">🎮 Produk Game</a>
    <a href="/admin/admin-pesanan.html" class="admin-nav-item">📦 Pesanan</a>
    <a href="/admin/admin-user.html" class="admin-nav-item active">👥 Users</a>
    <a href="/index.html" class="admin-nav-item">🏠 Lihat Toko</a>
    <a href="#" id="btnLogout" class="admin-nav-item" style="color:#ef4444;">🚪 Logout</a>
  </nav>
</aside>

<main class="admin-main">
  <header class="glass px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button id="btnToggleSidebar" class="md:hidden text-2xl">☰</button>
      <h1 class="text-xl font-bold">👥 Manajemen User</h1>
    </div>
  </header>

  <div class="p-4 md:p-8">
    <div class="glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">👥 Daftar User Terdaftar</h2>
        <span id="userCount" class="text-xs px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">0 user</span>
      </div>
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Role</th>
              <th>Total Order</th>
              <th>Total Belanja</th>
              <th>Terdaftar</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
      <div id="emptyUsers" class="hidden text-center py-12 text-gray-400">
        <div class="text-4xl mb-2">👥</div>
        <p>Belum ada user terdaftar</p>
      </div>
    </div>
  </div>
</main>

<script type="module">
import {
  db, auth, ADMIN_EMAIL,
  collection, onSnapshot, onAuthStateChanged, signOut,
  formatRupiah, formatDate
} from "/assets/js/main.js";

let users = [];
let orders = [];

onAuthStateChanged(auth, (user) => {
  if (!user || user.email !== ADMIN_EMAIL) location.href = "/admin/admin-login.html";
});

document.getElementById("btnLogout").onclick = async (e) => {
  e.preventDefault();
  await signOut(auth);
  location.href = "/admin/admin-login.html";
};

document.getElementById("btnToggleSidebar").onclick = () => {
  document.getElementById("sidebar").classList.toggle("open");
};

onSnapshot(collection(db, "users"), (snap) => {
  users = [];
  snap.forEach((d) => users.push({ id: d.id, ...d.data() }));
  users.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  renderUsers();
});

onSnapshot(collection(db, "orders"), (snap) => {
  orders = [];
  snap.forEach((d) => orders.push({ id: d.id, ...d.data() }));
  renderUsers();
});

function renderUsers() {
  document.getElementById("userCount").textContent = users.length + " user";
  const tbody = document.getElementById("usersTable");
  if (users.length === 0) {
    tbody.innerHTML = "";
    document.getElementById("emptyUsers").classList.remove("hidden");
    return;
  }
  document.getElementById("emptyUsers").classList.add("hidden");

  tbody.innerHTML = users.map((u) => {
    const uOrders = orders.filter((o) => o.userId === u.id);
    const totalSpent = uOrders.filter((o) => o.status === "sukses").reduce((s, o) => s + (o.price || 0), 0);
    return `
      <tr>
        <td class="font-semibold">${u.name || '-'}</td>
        <td class="text-sm">${u.email || '-'}</td>
        <td><span class="status-badge ${u.role === 'admin' ? 'status-sukses' : 'status-diproses'}">${u.role || 'user'}</span></td>
        <td>${uOrders.length}</td>
        <td class="text-cyan-400 font-semibold">${formatRupiah(totalSpent)}</td>
        <td class="text-xs text-gray-400">${formatDate(u.createdAt)}</td>
      </tr>
    `;
  }).join("");
}
</script>

</body>
</html>
