<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - CHAOS STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

<aside class="admin-sidebar" id="sidebar">
  <div class="p-6 border-b border-white/5">
    <a href="/admin/admin-dashboard.html" class="text-xl font-extrabold neon-text">🛡️ ADMIN PANEL</a>
  </div>
  <nav class="py-4">
    <a href="/admin/admin-dashboard.html" class="admin-nav-item active">📊 Dashboard</a>
    <a href="/admin/admin-produk.html" class="admin-nav-item">🎮 Produk Game</a>
    <a href="/admin/admin-pesanan.html" class="admin-nav-item">📦 Pesanan</a>
    <a href="/admin/admin-user.html" class="admin-nav-item">👥 Users</a>
    <a href="/index.html" class="admin-nav-item">🏠 Lihat Toko</a>
    <a href="#" id="btnLogout" class="admin-nav-item" style="color:#ef4444;">🚪 Logout</a>
  </nav>
</aside>

<main class="admin-main">
  <header class="glass px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button id="btnToggleSidebar" class="md:hidden text-2xl">☰</button>
      <h1 class="text-xl font-bold">📊 Dashboard</h1>
    </div>
    <div class="text-sm text-gray-300" id="adminEmail"></div>
  </header>

  <div class="p-4 md:p-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="stat-card">
        <div class="text-3xl mb-3">💰</div>
        <div class="text-xs text-gray-400 mb-1">Pendapatan Hari Ini</div>
        <div id="statTodayIncome" class="text-2xl font-extrabold neon-text">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="text-3xl mb-3">📊</div>
        <div class="text-xs text-gray-400 mb-1">Total Pendapatan</div>
        <div id="statTotalIncome" class="text-2xl font-extrabold neon-text">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="text-3xl mb-3">📦</div>
        <div class="text-xs text-gray-400 mb-1">Total Pesanan</div>
        <div id="statTotalOrders" class="text-2xl font-extrabold neon-text">0</div>
      </div>
      <div class="stat-card">
        <div class="text-3xl mb-3">⏳</div>
        <div class="text-xs text-gray-400 mb-1">Pesanan Pending</div>
        <div id="statPendingOrders" class="text-2xl font-extrabold text-yellow-400">0</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2 glass rounded-2xl p-6">
        <h2 class="font-bold text-lg mb-4">📈 Grafik Penjualan 7 Hari</h2>
        <canvas id="salesChart" height="120"></canvas>
      </div>
      <div class="glass rounded-2xl p-6">
        <h2 class="font-bold text-lg mb-4">📊 Status Pesanan</h2>
        <canvas id="statusChart" height="200"></canvas>
      </div>
    </div>

    <div class="glass rounded-2xl p-6">
      <h2 class="font-bold text-lg mb-4">🔥 Pesanan Terbaru</h2>
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Game</th>
              <th>Produk</th>
              <th>Total</th>
              <th>Status</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody id="recentOrders"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module">
import {
  db, auth, ADMIN_EMAIL,
  collection, onSnapshot, onAuthStateChanged, signOut,
  requireAdmin, toast, formatRupiah, formatDate
} from "/assets/js/main.js";

let salesChart = null;
let statusChart = null;

onAuthStateChanged(auth, async (user) => {
  if (!user || user.email !== ADMIN_EMAIL) {
    location.href = "/admin/admin-login.html";
    return;
  }
  document.getElementById("adminEmail").textContent = user.email;
});

document.getElementById("btnLogout").onclick = async (e) => {
  e.preventDefault();
  await signOut(auth);
  toast("Logout", "success");
  setTimeout(() => location.href = "/admin/admin-login.html", 500);
};

document.getElementById("btnToggleSidebar").onclick = () => {
  document.getElementById("sidebar").classList.toggle("open");
};

let allOrders = [];

onSnapshot(collection(db, "orders"), (snap) => {
  allOrders = [];
  snap.forEach((d) => allOrders.push({ id: d.id, ...d.data() }));
  allOrders.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  updateStats();
  renderRecentOrders();
  updateCharts();
});

function updateStats() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const todayOrders = allOrders.filter((o) => {
    const t = o.createdAt?.toDate?.();
    return t && t >= today && o.status === "sukses";
  });
  const todayIncome = todayOrders.reduce((s, o) => s + (o.price || 0), 0);
  const totalIncome = allOrders.filter((o) => o.status === "sukses").reduce((s, o) => s + (o.price || 0), 0);
  const pendingCount = allOrders.filter((o) => o.status === "pending").length;

  document.getElementById("statTodayIncome").textContent = formatRupiah(todayIncome);
  document.getElementById("statTotalIncome").textContent = formatRupiah(totalIncome);
  document.getElementById("statTotalOrders").textContent = allOrders.length;
  document.getElementById("statPendingOrders").textContent = pendingCount;
}

function renderRecentOrders() {
  const tbody = document.getElementById("recentOrders");
  const recent = allOrders.slice(0, 10);
  if (recent.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-gray-400 py-8">Belum ada pesanan</td></tr>`;
    return;
  }
  tbody.innerHTML = recent.map((o) => `
    <tr>
      <td class="font-mono text-xs text-cyan-400">${o.orderId}</td>
      <td>${o.gameName}</td>
      <td>${o.productName}</td>
      <td class="font-semibold">${formatRupiah(o.price)}</td>
      <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      <td class="text-xs text-gray-400">${formatDate(o.createdAt)}</td>
    </tr>
  `).join("");
}

function updateCharts() {
  const last7Days = [];
  const labels = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0, 0, 0, 0);
    const next = new Date(d);
    next.setDate(next.getDate() + 1);

    const dayOrders = allOrders.filter((o) => {
      const t = o.createdAt?.toDate?.();
      return t && t >= d && t < next && o.status === "sukses";
    });
    const sum = dayOrders.reduce((s, o) => s + (o.price || 0), 0);
    last7Days.push(sum);
    labels.push(d.toLocaleDateString("id-ID", { day: "2-digit", month: "short" }));
  }

  const salesCtx = document.getElementById("salesChart").getContext("2d");
  if (salesChart) salesChart.destroy();
  const gradient = salesCtx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, "rgba(0, 212, 255, 0.5)");
  gradient.addColorStop(1, "rgba(168, 85, 247, 0.05)");

  salesChart = new Chart(salesCtx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Pendapatan",
        data: last7Days,
        borderColor: "#00d4ff",
        backgroundColor: gradient,
        fill: true,
        tension: 0.4,
        pointBackgroundColor: "#00d4ff",
        pointBorderColor: "#fff",
        pointRadius: 5,
        pointHoverRadius: 8
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => formatRupiah(ctx.parsed.y)
          },
          backgroundColor: "rgba(26, 26, 36, 0.95)",
          borderColor: "#00d4ff",
          borderWidth: 1
        }
      },
      scales: {
        y: { ticks: { color: "#a0a0b0", callback: (v) => "Rp " + (v / 1000) + "k" }, grid: { color: "rgba(255,255,255,0.05)" } },
        x: { ticks: { color: "#a0a0b0" }, grid: { display: false } }
      }
    }
  });

  const statusCounts = {
    pending: allOrders.filter((o) => o.status === "pending").length,
    diproses: allOrders.filter((o) => o.status === "diproses").length,
    sukses: allOrders.filter((o) => o.status === "sukses").length,
    gagal: allOrders.filter((o) => o.status === "gagal").length
  };

  const statusCtx = document.getElementById("statusChart").getContext("2d");
  if (statusChart) statusChart.destroy();
  statusChart = new Chart(statusCtx, {
    type: "doughnut",
    data: {
      labels: ["Pending", "Diproses", "Sukses", "Gagal"],
      datasets: [{
        data: [statusCounts.pending, statusCounts.diproses, statusCounts.sukses, statusCounts.gagal],
        backgroundColor: ["#f59e0b", "#3b82f6", "#22c55e", "#ef4444"],
        borderColor: "#1a1a24",
        borderWidth: 3
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom", labels: { color: "#a0a0b0", padding: 15, font: { size: 12 } } }
      },
      cutout: "65%"
    }
  });
}
</script>

</body>
</html>
