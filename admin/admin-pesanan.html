<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

<aside class="admin-sidebar" id="sidebar">
  <div class="p-6 border-b border-white/5">
    <a href="/admin/admin-dashboard.html" class="text-xl font-extrabold neon-text">🛡️ ADMIN PANEL</a>
  </div>
  <nav class="py-4">
    <a href="/admin/admin-dashboard.html" class="admin-nav-item">📊 Dashboard</a>
    <a href="/admin/admin-produk.html" class="admin-nav-item">🎮 Produk Game</a>
    <a href="/admin/admin-pesanan.html" class="admin-nav-item active">📦 Pesanan</a>
    <a href="/admin/admin-user.html" class="admin-nav-item">👥 Users</a>
    <a href="/index.html" class="admin-nav-item">🏠 Lihat Toko</a>
    <a href="#" id="btnLogout" class="admin-nav-item" style="color:#ef4444;">🚪 Logout</a>
  </nav>
</aside>

<main class="admin-main">
  <header class="glass px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <button id="btnToggleSidebar" class="md:hidden text-2xl">☰</button>
      <h1 class="text-xl font-bold">📦 Manajemen Pesanan</h1>
    </div>
    <span class="text-xs px-3 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30">🟢 REALTIME</span>
  </header>

  <div class="p-4 md:p-8">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="stat-card">
        <div class="text-xs text-gray-400 mb-1">Total</div>
        <div id="cTotal" class="text-2xl font-bold">0</div>
      </div>
      <div class="stat-card">
        <div class="text-xs text-gray-400 mb-1">Pending</div>
        <div id="cPending" class="text-2xl font-bold text-yellow-400">0</div>
      </div>
      <div class="stat-card">
        <div class="text-xs text-gray-400 mb-1">Sukses</div>
        <div id="cSukses" class="text-2xl font-bold text-green-400">0</div>
      </div>
      <div class="stat-card">
        <div class="text-xs text-gray-400 mb-1">Gagal</div>
        <div id="cGagal" class="text-2xl font-bold text-red-400">0</div>
      </div>
    </div>

    <div class="glass rounded-2xl p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
        <h2 class="font-bold text-lg">📋 Daftar Pesanan</h2>
        <input id="searchOrder" type="text" class="input-field" style="width:auto;min-width:200px;" placeholder="🔍 Cari Order ID / Email">
      </div>
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Game / Produk</th>
              <th>User ID</th>
              <th>Total</th>
              <th>Metode</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
      <div id="emptyOrders" class="hidden text-center py-12 text-gray-400">
        <div class="text-4xl mb-2">📦</div>
        <p>Belum ada pesanan</p>
      </div>
    </div>
  </div>
</main>

<script type="module">
import {
  db, auth, ADMIN_EMAIL,
  collection, doc, updateDoc, onSnapshot, serverTimestamp,
  onAuthStateChanged, signOut, toast, formatRupiah, formatDate
} from "/assets/js/main.js";

let orders = [];
let searchQuery = "";

onAuthStateChanged(auth, (user) => {
  if (!user || user.email !== ADMIN_EMAIL) location.href = "/admin/admin-login.html";
});

document.getElementById("btnLogout").onclick = async (e) => {
  e.preventDefault();
  await signOut(auth);
  location.href = "/admin/admin-login.html";
};

document.getElementById("btnToggleSidebar").onclick = () => {
  document.getElementById("sidebar").classList.toggle("open");
};

document.getElementById("searchOrder").addEventListener("input", (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderOrders();
});

onSnapshot(collection(db, "orders"), (snap) => {
  orders = [];
  snap.forEach((d) => orders.push({ id: d.id, ...d.data() }));
  orders.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  updateCounters();
  renderOrders();
});

function updateCounters() {
  document.getElementById("cTotal").textContent = orders.length;
  document.getElementById("cPending").textContent = orders.filter((o) => o.status === "pending").length;
  document.getElementById("cSukses").textContent = orders.filter((o) => o.status === "sukses").length;
  document.getElementById("cGagal").textContent = orders.filter((o) => o.status === "gagal").length;
}

function renderOrders() {
  let list = orders;
  if (searchQuery) {
    list = list.filter((o) =>
      (o.orderId || "").toLowerCase().includes(searchQuery) ||
      (o.userEmail || "").toLowerCase().includes(searchQuery) ||
      (o.gameUserId || "").toLowerCase().includes(searchQuery)
    );
  }

  const tbody = document.getElementById("ordersTable");
  if (list.length === 0) {
    tbody.innerHTML = "";
    document.getElementById("emptyOrders").classList.remove("hidden");
    return;
  }
  document.getElementById("emptyOrders").classList.add("hidden");

  tbody.innerHTML = list.map((o) => `
    <tr>
      <td>
        <div class="font-mono text-xs text-cyan-400">${o.orderId}</div>
        <div class="text-xs text-gray-500">${formatDate(o.createdAt)}</div>
      </td>
      <td>
        <div class="font-semibold">${o.gameName}</div>
        <div class="text-xs text-gray-400">${o.productName}</div>
      </td>
      <td>
        <div class="font-mono text-sm">${o.gameUserId}</div>
        ${o.serverId ? `<div class="text-xs text-gray-500">Srv: ${o.serverId}</div>` : ''}
      </td>
      <td class="font-semibold text-cyan-400">${formatRupiah(o.price)}</td>
      <td class="text-xs">${o.paymentName || '-'}</td>
      <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      <td>
        <div class="flex flex-wrap gap-1">
          ${o.status === 'pending' ? `<button class="btn-sm btn-info" onclick="setStatus('${o.id}', 'diproses')">🔄 Proses</button>` : ''}
          ${o.status !== 'sukses' ? `<button class="btn-sm btn-success" onclick="setStatus('${o.id}', 'sukses')">✅ Sukses</button>` : ''}
          ${o.status !== 'gagal' ? `<button class="btn-sm btn-danger" onclick="setStatus('${o.id}', 'gagal')">❌ Gagal</button>` : ''}
        </div>
      </td>
    </tr>
  `).join("");
}

window.setStatus = async (id, status) => {
  try {
    await updateDoc(doc(db, "orders", id), {
      status,
      updatedAt: serverTimestamp()
    });
    toast(`Status diubah ke "${status}"`, "success");
  } catch (err) {
    toast("Gagal: " + err.message, "error");
  }
};
</script>

</body>
</html>
