<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - CHAOS STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<nav class="glass sticky top-0 z-50 px-4 md:px-8 py-4">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="/index.html" class="text-2xl font-extrabold neon-text">🎮 CHAOS<span class="text-white">STORE</span></a>
    <div class="flex items-center gap-3">
      <span id="userEmail" class="text-sm text-gray-300 hidden md:inline"></span>
      <button id="btnLogout" class="px-4 py-2 rounded-lg bg-red-500/20 border border-red-500/50 hover:bg-red-500/30 transition text-sm text-red-300">Keluar</button>
    </div>
  </div>
</nav>

<section class="max-w-7xl mx-auto px-4 md:px-8 py-8">
  <div class="glass rounded-2xl p-6 md:p-8 neon-border mb-8">
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold mb-1">👋 Halo, <span id="userName" class="neon-text">User</span></h1>
        <p class="text-gray-400 text-sm" id="userEmailSub"></p>
      </div>
      <a href="/index.html" class="glow-btn">🛒 Top Up Sekarang</a>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="glass rounded-xl p-5">
      <div class="text-3xl mb-2">📦</div>
      <div class="text-xs text-gray-400 mb-1">Total Pesanan</div>
      <div id="statTotal" class="text-2xl font-extrabold neon-text">0</div>
    </div>
    <div class="glass rounded-xl p-5">
      <div class="text-3xl mb-2">⏳</div>
      <div class="text-xs text-gray-400 mb-1">Pending</div>
      <div id="statPending" class="text-2xl font-extrabold text-yellow-400">0</div>
    </div>
    <div class="glass rounded-xl p-5">
      <div class="text-3xl mb-2">✅</div>
      <div class="text-xs text-gray-400 mb-1">Sukses</div>
      <div id="statSukses" class="text-2xl font-extrabold text-green-400">0</div>
    </div>
    <div class="glass rounded-xl p-5">
      <div class="text-3xl mb-2">💰</div>
      <div class="text-xs text-gray-400 mb-1">Total Belanja</div>
      <div id="statTotalSpent" class="text-lg font-extrabold neon-text">Rp 0</div>
    </div>
  </div>

  <h2 class="text-2xl font-extrabold mb-4">📋 Riwayat Transaksi</h2>

  <div class="glass rounded-2xl p-4 md:p-6">
    <div id="ordersLoading" class="text-center py-12">
      <div class="text-4xl mb-3 animate-float">⏳</div>
      <p class="text-gray-400">Memuat riwayat...</p>
    </div>
    <div id="ordersList" class="hidden space-y-3"></div>
    <div id="ordersEmpty" class="hidden text-center py-12">
      <div class="text-5xl mb-3">🎮</div>
      <p class="text-gray-400 mb-4">Belum ada transaksi</p>
      <a href="/index.html" class="glow-btn inline-block">Mulai Top Up</a>
    </div>
  </div>
</section>

<script type="module">
import {
  auth, db,
  collection, query, where, orderBy, onSnapshot, doc, getDoc,
  onAuthStateChanged, signOut, toast, formatRupiah, formatDate
} from "/assets/js/main.js";

let unsubOrders = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "/user/login.html";
    return;
  }
  document.getElementById("userEmail").textContent = user.email;
  document.getElementById("userEmailSub").textContent = user.email;

  try {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      document.getElementById("userName").textContent = data.name || user.email.split("@")[0];
    }
  } catch (e) {}

  loadOrders(user.uid);
});

function loadOrders(uid) {
  const q = query(
    collection(db, "orders"),
    where("userId", "==", uid)
  );

  unsubOrders = onSnapshot(q, (snap) => {
    const orders = [];
    snap.forEach((d) => orders.push({ id: d.id, ...d.data() }));
    orders.sort((a, b) => {
      const at = a.createdAt?.toMillis?.() || 0;
      const bt = b.createdAt?.toMillis?.() || 0;
      return bt - at;
    });
    renderOrders(orders);
    updateStats(orders);
  });
}

function updateStats(orders) {
  document.getElementById("statTotal").textContent = orders.length;
  document.getElementById("statPending").textContent = orders.filter((o) => o.status === "pending").length;
  document.getElementById("statSukses").textContent = orders.filter((o) => o.status === "sukses").length;
  const totalSpent = orders.filter((o) => o.status === "sukses").reduce((s, o) => s + (o.price || 0), 0);
  document.getElementById("statTotalSpent").textContent = formatRupiah(totalSpent);
}

function renderOrders(orders) {
  document.getElementById("ordersLoading").classList.add("hidden");
  if (orders.length === 0) {
    document.getElementById("ordersEmpty").classList.remove("hidden");
    document.getElementById("ordersList").classList.add("hidden");
    return;
  }
  document.getElementById("ordersEmpty").classList.add("hidden");
  const list = document.getElementById("ordersList");
  list.classList.remove("hidden");

  list.innerHTML = orders.map((o) => {
    const cls = {
      pending: "status-pending",
      diproses: "status-diproses",
      sukses: "status-sukses",
      gagal: "status-gagal"
    }[o.status] || "status-pending";
    const txt = {
      pending: "⏳ Pending",
      diproses: "🔄 Diproses",
      sukses: "✅ Sukses",
      gagal: "❌ Gagal"
    }[o.status] || "Pending";

    return `
      <div class="glass rounded-xl p-4 hover:border-cyan-400/40 transition cursor-pointer" onclick="location.href='/invoice.html?orderId=${o.orderId}'">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-xs text-cyan-400">${o.orderId}</span>
              <span class="px-2 py-0.5 rounded text-xs font-semibold ${cls}">${txt}</span>
            </div>
            <div class="font-bold">${o.gameName} - ${o.productName}</div>
            <div class="text-xs text-gray-400 mt-1">
              ${formatDate(o.createdAt)} • ID: ${o.gameUserId}
            </div>
          </div>
          <div class="text-right">
            <div class="font-bold neon-text">${formatRupiah(o.price)}</div>
            <div class="text-xs text-gray-400">${o.paymentName || '-'}</div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("btnLogout").onclick = async () => {
  if (unsubOrders) unsubOrders();
  await signOut(auth);
  toast("Logout berhasil", "success");
  setTimeout(() => location.href = "/index.html", 800);
};
</script>

</body>
</html>
