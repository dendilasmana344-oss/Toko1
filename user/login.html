<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - CHAOS STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <a href="/index.html" class="text-3xl font-extrabold neon-text">🎮 CHAOS STORE</a>
    <p class="text-gray-400 mt-2 text-sm">Masuk untuk melanjutkan</p>
  </div>

  <div class="glass rounded-2xl p-8 neon-border">
    <h1 class="text-2xl font-bold mb-6 text-center">🔐 Masuk</h1>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-sm text-gray-400 mb-2 block">Email</label>
        <input id="email" type="email" class="input-field" placeholder="email@example.com" required>
      </div>
      <div>
        <label class="text-sm text-gray-400 mb-2 block">Password</label>
        <input id="password" type="password" class="input-field" placeholder="••••••••" required>
      </div>
      <button id="btnLogin" type="submit" class="glow-btn w-full">Masuk</button>
    </form>

    <div class="text-center mt-6 text-sm text-gray-400">
      Belum punya akun? <a href="/user/register.html" class="text-cyan-400 hover:underline font-semibold">Daftar</a>
    </div>
  </div>

  <div class="text-center mt-6">
    <a href="/index.html" class="text-sm text-gray-400 hover:text-cyan-400">← Kembali ke beranda</a>
  </div>
</div>

<script type="module">
import {
  auth, db,
  signInWithEmailAndPassword, updateLastLogin, toast
} from "/assets/js/main.js";

document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  btn.textContent = "⏳ Memproses...";

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const cred = await signInWithEmailAndPassword(auth, email, password);
    await updateLastLogin(cred.user.uid);
    toast("Login berhasil!", "success");
    setTimeout(() => location.href = "/user/dashboard.html", 800);
  } catch (err) {
    let msg = "Login gagal";
    if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") msg = "Email atau password salah";
    else if (err.code === "auth/user-not-found") msg = "Akun tidak ditemukan";
    else if (err.code === "auth/too-many-requests") msg = "Terlalu banyak percobaan. Coba lagi nanti.";
    toast(msg, "error");
    btn.disabled = false;
    btn.textContent = "Masuk";
  }
};
</script>

</body>
</html>
